name: Site

# Builds ngpdf.dev (projects/site, prerendered to static HTML) and uploads it to the Hostinger
# host over FTPS, into public_html (the FTP account's root). Runs when main changes something the
# site shows: its own code, the library it demos, the docs, the changelog or the contributors. Run
# it by hand to redeploy as it is.

on:
  push:
    branches: [main]
    paths:
      - 'projects/site/**'
      - 'projects/core/**'
      - 'projects/demo/src/app/**'
      - 'scripts/site-*.mjs'
      - '.all-contributorsrc'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time, and never cancel one halfway: a cut upload leaves a mixed site.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ngpdf.dev
      url: https://ngpdf.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:site
      # The FTP server is known by its IP address (the FTP_SERVER secret), and its certificate
      # names *.hstgr.io, Hostinger's domain. Pointing a name under that domain at the IP lets the
      # upload verify the certificate strictly, so the password goes only to a server holding
      # Hostinger's certificate.
      - name: Pin the FTP host name
        run: echo "${FTP_SERVER} ngpdf-deploy.hstgr.io" | sudo tee -a /etc/hosts >/dev/null
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
      # Uploads only what changed since the last deploy (the action keeps a sync state file on the
      # server) and deletes files a build no longer has.
      - uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ngpdf-deploy.hstgr.io
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/site/browser/
          # The FTP account opens in public_html already, so the site goes at its root.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
