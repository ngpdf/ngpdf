name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # No dependency needs an install script (prebuilt binaries ship as optional packages),
      # so there is no `npm rebuild` step. Add one here, naming the package, if that changes.
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Typed lint resolves @ngpdf/core from dist/core and the site's generated data, so both exist
      # before it runs.
      - run: npm run build:core
      - run: node scripts/site-data.mjs
      - run: npm run lint
      # The package README's usage sections must match the repository README's.
      - run: node scripts/check-readme.mjs

  # ngpdf.dev: the prerender runs every page, so a docs page that fails to parse or a component
  # that throws on the server fails here, before the deploy.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:site

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx ng build demo

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Advisory: npm audit cannot read the ignore list in osv-scanner.toml, so OSV-Scanner below
      # is the gating scanner. A finding here still shows in the job log and the PR checks.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # An ignore in osv-scanner.toml needs a reason and an ignoreUntil at most 90 days ahead.
      - run: node scripts/check-osv-ignores.mjs
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  bundle-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Builds dist/core and the demo against it, and fails above 15 KB gzipped of @ngpdf/core in
      # the initial chunks or when the package's main file imports the engine statically.
      - run: node scripts/bundle-budget.mjs

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      # Fails when the files npm would publish include a spec, bench or test helper, or lack a
      # LICENSE or README.
      - run: node scripts/check-pack.mjs dist/core

  # The packed package on the server: a plain Node script installs the tarball, renders with
  # @ngpdf/core/server and no DOM, and pdftotext checks the PDF. On the lowest Node major Angular
  # supports and on the one the other jobs use, with the repository's Angular, and once with the
  # lowest @angular/core the peer range allows, since renderToBuffer uses a private Angular export.
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24]
        angular: ['']
        include:
          - node-version: 22
            angular: 22.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - run: node scripts/server-check.mjs ${ANGULAR:+--angular "$ANGULAR"}
        env:
          ANGULAR: ${{ matrix.angular }}

  # The packed tarball, as users get it from npm: `ng add` on a fresh `ng new` app, then `ng build`
  # with nothing changed by hand.
  ng-add:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-manager: npm
            app: fresh-app
          # A pnpm workspace with the app in apps/ and hoist=false: nothing but its own
          # dependencies resolves from @ngpdf/core, and the app's typescript is not up its tree.
          # The schematic must take the devkit from the CLI and typescript from the app.
          - package-manager: pnpm
            app: mono/apps/fresh-app
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: dist/core
      # The app is made with the Angular CLI major this repository builds with.
      - id: cli
        run: echo "major=$(node -p "require('@angular/cli/package.json').version.split('.')[0]")" >> "$GITHUB_OUTPUT"
      - if: matrix.package-manager == 'pnpm'
        name: Set up a pnpm workspace without hoisting
        run: |
          npm install --global pnpm@10.34.9
          mkdir -p mono/apps
          printf '{ "name": "mono", "private": true }\n' > mono/package.json
          printf 'packages:\n  - apps/*\n' > mono/pnpm-workspace.yaml
          printf 'hoist=false\n' > mono/.npmrc
        working-directory: ${{ runner.temp }}
      - run: >-
          npx --yes @angular/cli@${{ steps.cli.outputs.major }} new fresh-app --defaults
          --interactive=false --skip-git --ai-config=none
          --package-manager=${{ matrix.package-manager }}
          ${{ matrix.package-manager == 'pnpm' && '--skip-install' || '' }}
        working-directory: ${{ runner.temp }}/${{ matrix.package-manager == 'pnpm' && 'mono/apps' || '' }}
      - if: matrix.package-manager == 'pnpm'
        name: Install the workspace
        run: |
          pnpm install
          test ! -e node_modules/.pnpm/node_modules/@angular-devkit
          test ! -e node_modules/typescript
        working-directory: ${{ runner.temp }}/mono
      - run: npx ng add "$RUNNER_TEMP"/ngpdf-core-*.tgz --skip-confirmation --interactive=false --demo-route
        working-directory: ${{ runner.temp }}/${{ matrix.app }}
      # The build below must depend on what ng add wrote, so check it is there first.
      - name: Check the generated files and route
        run: |
          grep -q 'export class ExampleDocument' src/app/documents/example-document.ts
          grep -q 'export class PdfDemo' src/app/documents/pdf-demo.ts
          grep -q "path: 'pdf-demo'" src/app/app.routes.ts
          grep -q "import('./documents/pdf-demo')" src/app/app.routes.ts
        working-directory: ${{ runner.temp }}/${{ matrix.app }}
      - run: npx ng build
        working-directory: ${{ runner.temp }}/${{ matrix.app }}

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci --ignore-scripts
      # Builds the demo in development mode, renders the three documents in headless Chrome and
      # compares their text with e2e/expected/*.txt.
      - run: node scripts/e2e.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-pdfs
          path: e2e/out
