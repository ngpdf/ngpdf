name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Opens or updates the "Version Packages" pull request from the pending changesets.
  release-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run changeset:version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # A pull request opened with GITHUB_TOKEN triggers no workflows, so the required checks
          # would never run on it. RELEASE_BOT_TOKEN (a GitHub App installation token or a
          # fine-grained PAT with contents and pull-requests write) fixes that. This is the only
          # job that sees the secret. See "Repository setup (maintainer)" in CONTRIBUTING.md.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

  # Read-only: decides what this push has to do. Nothing happens while a changeset is pending or
  # the version is 0.0.0. Otherwise npm is published when the version is not on npm, and the
  # GitHub release is created when it does not exist. They are separate decisions, so a rerun
  # after a partial failure finishes the missing half.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./projects/core/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          publish=false
          release=false
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)"
          if [ "${pending}" -eq 0 ] && [ "${version}" != "0.0.0" ]; then
            npm view "@ngpdf/core@${version}" version >/dev/null 2>&1 || publish=true
            gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || release=true
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

  # Builds without any write permission, so the publish job runs no build tooling.
  build:
    needs: check
    if: needs.check.outputs.publish == 'true' || needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - run: npm run build:core
      # CycloneDX SBOM of the runtime dependencies, attached to the GitHub release.
      - run: npm sbom --sbom-format cyclonedx --omit dev --workspace projects/core > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/core
            sbom.cdx.json
          retention-days: 7

  # The only job with id-token: publishes to npm with trusted publishing (OIDC) and provenance.
  # It runs no repository code except `npm publish`.
  publish:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Check npm supports trusted publishing (11.5.1 or newer)
        run: |
          npm --version
          printf '11.5.1\n%s\n' "$(npm --version)" | sort -V -C
      - run: npm publish --provenance --access public
        working-directory: dist/core
        env:
          # Only for the first version: npm takes a trusted publisher only for a package that
          # exists. Once it is added on npmjs.com, delete the NPM_TOKEN secret and npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Creates the GitHub release with the SBOM. It runs when npm was published now or earlier, and
  # also when only this step failed on a previous run.
  github-release:
    needs: [check, build, publish]
    if: >-
      !cancelled() && needs.check.outputs.release == 'true' && needs.build.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - run: gh release create "v${VERSION}" sbom.cdx.json --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "v${VERSION}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
