<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ngpdf - PDFs as Angular components</title>
    <meta
      name="description"
      content="ngpdf renders Angular components to PDF in the browser: real text, tables with repeating headers, page breaks and page numbers, with a 2 KB eager bundle."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141311" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Before first paint, so a reader who chose dark gets no white flash. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <site-root></site-root>
  </body>
</html>
