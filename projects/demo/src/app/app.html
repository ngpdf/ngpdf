<main>
  <h1>ngpdf demo</h1>
  <p>Write PDFs as Angular components, for Angular. All data here is made up.</p>

  <div #chart class="chart" aria-label="Made-up monthly chart" role="img">
    @for (bar of bars; track bar.label) {
      <div class="bar" [attr.data-label]="bar.label" [style.height.px]="bar.value * 2"></div>
    }
  </div>

  <div class="actions">
    <button type="button" (click)="download('capture-report')">Capture report</button>
    <button type="button" (click)="download('communicators-list')">Communicators list</button>
    <button type="button" (click)="download('licences-list')">Licences list</button>
    <button type="button" (click)="download('fonts-sample')">Font sample</button>
    <button type="button" (click)="download('span-sample')">Span sample</button>
    <button type="button" (click)="download('article-sample')">Article sample</button>
    <button type="button" (click)="download('fixed-sample')">Fixed header sample</button>
    <button type="button" (click)="download('contents-sample')">Contents sample</button>
  </div>
  <p role="status">{{ status() }}</p>
</main>
